base:
  output_dir: results/compact_s_60_dim256
  seed: 599
  epochs: 100
  patience: 15
  reset_optimizer_on_extend: false
  reset_patience_on_extend: true
  batch_size: 256
  lr: 0.0005
  weight_decay: 0.0001
  lr_scheduler: reduce_on_plateau
  lr_scheduler_metric: val_macro_f1
  lr_factor: 0.5
  lr_patience: 2
  min_lr: 0.000001
  early_stop_metric: val_raw_open_set_macro_f1
  early_stop_min_delta: 0.0005
  seq_len: 30
  amp: true
  num_workers: 0
  model_cfg:
    dim: 256
    depth: 2
    heads: 4
    mlp_ratio: 4
    dropout: 0.15
    d_state: 16
    d_conv: 4
    expand: 2
    frequency_representation: magnitude
    fusion_mode: tokens
    use_raw_conv: true
    pooling: mean
    frequency_token_scale: 1.0
    max_len: 30
    conv_kernel_size: 3
    attention_backend: flash
  train_unknown: true
  calibrate_reject_threshold: true
  reject_threshold_quantile: 0.95

experiments:
  - {exp_name: hsta_cm_dft_tls60_s_seed599, model: hsta-cm-dft, data_csv: data/processed/datazoo_tls60_s_protocol_small_sampled.csv, seed: 599}
  - {exp_name: hsta_cm_no_dft_tls60_s_seed599, model: hsta-cm, data_csv: data/processed/datazoo_tls60_s_protocol_small_sampled.csv, seed: 599}
  - {exp_name: hsta_cm_dft_quic60_s_seed599, model: hsta-cm-dft, data_csv: data/processed/datazoo_quic60_s_protocol_small_sampled.csv, seed: 599, model_cfg: {frequency_token_scale: 0.1}}
  - {exp_name: hsta_cm_no_dft_quic60_s_seed599, model: hsta-cm, data_csv: data/processed/datazoo_quic60_s_protocol_small_sampled.csv, seed: 599}
