# =============================================================================
# HSTA v13 -- Study 2: Mamba:Attention ratio at a CONTROLLED parameter budget
# =============================================================================
#
# WHY THIS FILE EXISTS
# --------------------
# Study 1 (configs/ratio_scale_v13.yaml) varied the number of state-space
# blocks while holding the WIDTH fixed at d=128. That changes both the ratio
# AND the model size: parameters rose monotonically from 486k (1:1) to 836k
# (4:1), and the measured Macro-F1 also rose monotonically:
#
#     ratio   blocks   params     Macro-F1 (QUIC-60, 6 seeds)
#     1:0       2      287,400    86.78
#     1:1       4      485,672    89.87
#     2:1       5      602,408    90.48
#     3:1       6      719,144    90.56
#     4:1       7      835,880    90.75
#
# That ordering is exactly what a CAPACITY effect would produce, so Study 1
# CANNOT attribute the difference to the ratio. An earlier plan for a
# parameter-matched study was dropped on the argument that the width would have
# to be retuned per arm; that argument was wrong, and Study 1's result shows it.
#
# THE FIX: MATCH PARAMETERS, THEN VARY THE RATIO
# ----------------------------------------------
# Measured block sizes at d=128 (scripts/alignment_models.py):
#     one Mamba block                      116,736
#     one attention block                  66,304
#     one FFN block                        131,968
# The widths below were selected by building the actual model, keeping heads,
# FFN ratio, and all state-space settings unchanged in every arm.
#
# The three arms below therefore land within a few percent of each other:
#
#     arm          layout                                      blocks   M:A  dim  params (60 cls)
#     M2A1 (ref)   mamba, mamba, mlp, attn, mlp                   5     2:1  128  604,988
#     M3A1         mamba, mamba, mamba, mlp, attn, mlp             6     3:1  116  601,172
#     M2A2         mamba, mamba, mlp, attn, mlp, attn, mlp         7     1:1  112  623,116
#
# MEASURE BEFORE YOU TRUST THE MATCH
# ----------------------------------
# Run the probe first and read the `Ratio arms at dim=128` table:
#
#     bash scripts/run_evidence_pack.sh probe
#
# The M3A1 arm is within 1% of M2A1; M2A2 is a roughly 3% near-match. Keep the
# measured parameter counts in the report and do not describe M2A2 as exactly
# equal-parameter.
#
# WHAT EACH OUTCOME MEANS (decide only AFTER seeing the numbers)
# --------------------------------------------------------------
#   * M3A1 or M2A2 clearly above M2A1 at matched parameters
#       -> the ratio matters, and MORE Mamba (3:1) or MORE attention (1:1) is
#          better than 2:1. The "2:1 is best" framing is dead either way;
#          report which direction wins.
#   * All three within seed noise
#       -> the ratio is NOT a first-order design variable at this budget. The
#          honest headline becomes the attention ablation (1:0 loses 3.70 pp)
#          plus the accuracy-per-parameter trade-off, and the 2:1 arm is
#          presented as a reasonable operating point rather than an optimum.
#
# DO NOT RUN THIS UNTIL THE GPU IS FREE
#   `parallel_placement` is currently using it. Queue this run afterwards.
#
# COST
#   3 arms x 6 seeds = 18 runs on QUIC-60. ~4-7 h serial, ~2 h with 3 workers.
#   Depth 6 and 7 arms cost proportionally more than the depth-5 reference.
#
# RUN
#   bash scripts/run_evidence_pack.sh parallel_ratio_budget 3
#   bash scripts/run_evidence_pack.sh ratio_report
# =============================================================================

base:
  output_dir: results/ratio_budget_v13
  seed: 42
  epochs: 100
  patience: 20
  batch_size: 512
  lr: 0.0005
  weight_decay: 0.0001
  lr_scheduler: reduce_on_plateau
  lr_scheduler_metric: val_macro_f1
  lr_factor: 0.5
  lr_patience: 3
  min_lr: 0.000001
  early_stop_metric: val_macro_f1
  early_stop_min_delta: 0.0005
  seq_len: 30
  amp: true
  num_workers: 0
  model: hsta
  model_cfg:
    dim: 128
    hidden: 128
    heads: 4
    mlp_ratio: 4
    dropout: 0.15
    d_state: 16
    d_conv: 4
    expand: 2
    pooling: mean
    max_len: 256
    attention_backend: flash

experiments:
  # ===========================================================================
  # ARM M2A1 (2:1) -- reference configuration, 5 blocks.
  # ===========================================================================
  - exp_name: ratiobud_m2a1_2to1_quic60_s_seed42
    data_csv: data/processed/datazoo_quic60_s_seq30.csv
    seed: 42
    model_cfg:
      dim: 128
      layout: [mamba, mamba, mlp, attention, mlp]
  - exp_name: ratiobud_m2a1_2to1_quic60_s_seed2025
    data_csv: data/processed/datazoo_quic60_s_seq30.csv
    seed: 2025
    model_cfg:
      dim: 128
      layout: [mamba, mamba, mlp, attention, mlp]
  - exp_name: ratiobud_m2a1_2to1_quic60_s_seed3407
    data_csv: data/processed/datazoo_quic60_s_seq30.csv
    seed: 3407
    model_cfg:
      dim: 128
      layout: [mamba, mamba, mlp, attention, mlp]
  - exp_name: ratiobud_m2a1_2to1_quic60_s_seed1337
    data_csv: data/processed/datazoo_quic60_s_seq30.csv
    seed: 1337
    model_cfg:
      dim: 128
      layout: [mamba, mamba, mlp, attention, mlp]
  - exp_name: ratiobud_m2a1_2to1_quic60_s_seed7
    data_csv: data/processed/datazoo_quic60_s_seq30.csv
    seed: 7
    model_cfg:
      dim: 128
      layout: [mamba, mamba, mlp, attention, mlp]
  - exp_name: ratiobud_m2a1_2to1_quic60_s_seed2024
    data_csv: data/processed/datazoo_quic60_s_seq30.csv
    seed: 2024
    model_cfg:
      dim: 128
      layout: [mamba, mamba, mlp, attention, mlp]

  # ===========================================================================
  # ARM M3A1 (3:1) -- six blocks at dim=116, approximately parameter-matched
  # to the dim=128 M2A1 reference.
  # ===========================================================================
  - exp_name: ratiobud_m3a1_3to1_quic60_s_seed42
    data_csv: data/processed/datazoo_quic60_s_seq30.csv
    seed: 42
    model_cfg:
      dim: 116
      layout: [mamba, mamba, mamba, mlp, attention, mlp]
  - exp_name: ratiobud_m3a1_3to1_quic60_s_seed2025
    data_csv: data/processed/datazoo_quic60_s_seq30.csv
    seed: 2025
    model_cfg:
      dim: 116
      layout: [mamba, mamba, mamba, mlp, attention, mlp]
  - exp_name: ratiobud_m3a1_3to1_quic60_s_seed3407
    data_csv: data/processed/datazoo_quic60_s_seq30.csv
    seed: 3407
    model_cfg:
      dim: 116
      layout: [mamba, mamba, mamba, mlp, attention, mlp]
  - exp_name: ratiobud_m3a1_3to1_quic60_s_seed1337
    data_csv: data/processed/datazoo_quic60_s_seq30.csv
    seed: 1337
    model_cfg:
      dim: 116
      layout: [mamba, mamba, mamba, mlp, attention, mlp]
  - exp_name: ratiobud_m3a1_3to1_quic60_s_seed7
    data_csv: data/processed/datazoo_quic60_s_seq30.csv
    seed: 7
    model_cfg:
      dim: 116
      layout: [mamba, mamba, mamba, mlp, attention, mlp]
  - exp_name: ratiobud_m3a1_3to1_quic60_s_seed2024
    data_csv: data/processed/datazoo_quic60_s_seq30.csv
    seed: 2024
    model_cfg:
      dim: 116
      layout: [mamba, mamba, mamba, mlp, attention, mlp]

  # ===========================================================================
  # ARM M2A2 (1:1) -- seven blocks at dim=112. The two attention units are
  # separated by an FFN so neither attention block is adjacent to the other.
  # ===========================================================================
  - exp_name: ratiobud_m2a2_1to1_quic60_s_seed42
    data_csv: data/processed/datazoo_quic60_s_seq30.csv
    seed: 42
    model_cfg:
      dim: 112
      layout: [mamba, mamba, mlp, attention, mlp, attention, mlp]
  - exp_name: ratiobud_m2a2_1to1_quic60_s_seed2025
    data_csv: data/processed/datazoo_quic60_s_seq30.csv
    seed: 2025
    model_cfg:
      dim: 112
