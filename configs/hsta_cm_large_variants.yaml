base:
  output_dir: results/hsta_cm_large_variants
  seed: 599
  epochs: 100
  patience: 15
  reset_optimizer_on_extend: false
  reset_patience_on_extend: true
  batch_size: 4096
  lr: 0.0005
  weight_decay: 0.0001
  lr_scheduler: reduce_on_plateau
  lr_scheduler_metric: val_known_macro_f1
  lr_scheduler_mode: max
  lr_factor: 0.5
  lr_patience: 2
  min_lr: 0.000001
  early_stop_metric: val_known_macro_f1
  early_stop_mode: max
  early_stop_min_delta: 0.0005
  seq_len: 30
  amp: true
  num_workers: 0
  calibrate_reject_threshold: true
  reject_threshold_quantile: 0.95
  model_cfg:
    dim: 256
    depth: 2
    heads: 4
    mlp_ratio: 4
    dropout: 0.15
    d_state: 16
    d_conv: 4
    expand: 2
    max_len: 30
    pooling: mean
    conv_kernel_size: 3
    attention_backend: flash
    use_position: false
    use_packet_position: true
    use_frequency_position: false
    use_branch_type: true
    use_conv: true
    use_mamba: true
    use_dft: false
    fusion_mode: aligned

experiments:
  # Candidate 1: original two branches, with progressive raw Conv1d kernels.
  - exp_name: hsta_cm_multiscale_tls60_s_large_seed599
    model: hsta-cm
    data_csv: data/processed/datazoo_tls60_s_protocol_large_sampled.csv
    seed: 599
    train_unknown: true
    model_cfg:
      conv_kernel_schedule: [1, 3, 5]

  - exp_name: hsta_cm_multiscale_quic60_s_large_seed599
    model: hsta-cm
    data_csv: data/processed/datazoo_quic60_s_protocol_large_sampled.csv
    seed: 599
    train_unknown: true
    model_cfg:
      conv_kernel_schedule: [1, 3, 5]

  # Candidate 2: Mamba + raw Conv1d + DFT Conv1d, with standard k=3 blocks.
  - exp_name: hsta_cm_dual_plus_dft_tls60_s_large_seed599
    model: hsta-cm
    data_csv: data/processed/datazoo_tls60_s_protocol_large_sampled.csv
    seed: 599
    train_unknown: true
    model_cfg:
      max_len: 76
      pooling: branch_mean
      use_frequency_position: true
      use_dft: true
      fusion_mode: tokens
      dft_conv_kernel_schedule: [3, 3, 3]

  - exp_name: hsta_cm_dual_plus_dft_quic60_s_large_seed599
    model: hsta-cm
    data_csv: data/processed/datazoo_quic60_s_protocol_large_sampled.csv
    seed: 599
    train_unknown: true
    model_cfg:
      max_len: 76
      pooling: branch_mean
      use_frequency_position: true
      use_dft: true
      fusion_mode: tokens
      dft_conv_kernel_schedule: [3, 3, 3]

  # Candidate 3: full three-branch model with progressive kernels in both
  # raw and frequency convolutional extraction blocks.
  - exp_name: hsta_cm_tri_multiscale_dft_tls60_s_large_seed599
    model: hsta-cm
    data_csv: data/processed/datazoo_tls60_s_protocol_large_sampled.csv
    seed: 599
    train_unknown: true
    model_cfg:
      max_len: 76
      pooling: branch_mean
      use_frequency_position: true
      use_dft: true
      fusion_mode: tokens
      conv_kernel_schedule: [1, 3, 5]
      dft_conv_kernel_schedule: [1, 3, 5]

  - exp_name: hsta_cm_tri_multiscale_dft_quic60_s_large_seed599
    model: hsta-cm
    data_csv: data/processed/datazoo_quic60_s_protocol_large_sampled.csv
    seed: 599
    train_unknown: true
    model_cfg:
      max_len: 76
      pooling: branch_mean
      use_frequency_position: true
      use_dft: true
      fusion_mode: tokens
      conv_kernel_schedule: [1, 3, 5]
      dft_conv_kernel_schedule: [1, 3, 5]
