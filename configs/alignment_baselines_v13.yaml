    model: 30pkttcnet_adapted
    data_csv: data/processed/datazoo_quic60_s_seq30.csv
    seed: 42
    model_cfg:
      depth: 5
  - exp_name: alignv13_30pkttcnet_adapted_d5_quic60_s_seed2025
    model: 30pkttcnet_adapted
    data_csv: data/processed/datazoo_quic60_s_seq30.csv
    seed: 2025
    model_cfg:
      depth: 5
  - exp_name: alignv13_30pkttcnet_adapted_d5_quic60_s_seed3407
    model: 30pkttcnet_adapted
    data_csv: data/processed/datazoo_quic60_s_seq30.csv
    seed: 3407
    model_cfg:
      depth: 5
  - exp_name: alignv13_30pkttcnet_adapted_d5_quic60_s_seed1337
    model: 30pkttcnet_adapted
    data_csv: data/processed/datazoo_quic60_s_seq30.csv
    seed: 1337
