# Exploratory package-preserving gated HSTA-CM: one TLS seed.
seeds: [599]
base:
  output_dir: results/hsta_cm_gated_tls_pilot
  seed: 599
  epochs: 100
  patience: 15
  batch_size: 4096
  eval_batch_size: 512
  oom_microbatch_fallbacks: [2048, 1024, 512]
  lr: 0.0005
  weight_decay: 0.0001
  lr_scheduler: reduce_on_plateau
  lr_scheduler_metric: val_known_macro_f1
  lr_scheduler_mode: max
  lr_factor: 0.5
  lr_patience: 2
  min_lr: 0.000001
  early_stop_metric: val_known_macro_f1
  early_stop_mode: max
  early_stop_min_delta: 0.0005
  seq_len: 30
  amp: true
  num_workers: 0
  calibrate_reject_threshold: true
  reject_threshold_quantile: 0.95
  model_cfg:
    dim: 256
    depth: 2
    heads: 4
    mlp_ratio: 4
    dropout: 0.15
    d_state: 16
    d_conv: 4
    expand: 2
    graph_k: 4
    aux_loss_weight: 0.1
    branch_residual_init: 0.1
experiments:
  - exp_name: hsta_cm_gated_open_tls60
    model: hsta-cm-gated
    data_csv: data/processed/datazoo_tls60_s_protocol.csv
    train_unknown: true
