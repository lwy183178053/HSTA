base:
  output_dir: results/hsta_no_attention
  seed: 42
  epochs: 100
  patience: 20
  batch_size: 512
  lr: 0.0005
  weight_decay: 0.0001
  lr_scheduler: reduce_on_plateau
  lr_scheduler_metric: val_macro_f1
  lr_factor: 0.5
  lr_patience: 3
  min_lr: 0.000001
  early_stop_metric: val_macro_f1
  early_stop_min_delta: 0.0005
  seq_len: 30
  amp: true
  num_workers: 0
  model: hsta
  model_cfg:
    dim: 128
    heads: 4
    mlp_ratio: 4
    dropout: 0.15
    d_state: 16
    d_conv: 4
    expand: 2
    pooling: mean
    max_len: 256
    layout: [mamba, mamba, mlp, mlp, mlp]

experiments:
  - exp_name: ablation_no_attention_tls40_s_seed42
    data_csv: data/processed/datazoo_tls40_s_seq30.csv
    seed: 42
  - exp_name: ablation_no_attention_tls40_s_seed2025
    data_csv: data/processed/datazoo_tls40_s_seq30.csv
    seed: 2025
  - exp_name: ablation_no_attention_tls40_s_seed3407
    data_csv: data/processed/datazoo_tls40_s_seq30.csv
    seed: 3407
  - exp_name: ablation_no_attention_quic40_s_seed42
    data_csv: data/processed/datazoo_quic40_s_seq30.csv
    seed: 42
  - exp_name: ablation_no_attention_quic40_s_seed2025
    data_csv: data/processed/datazoo_quic40_s_seq30.csv
    seed: 2025
  - exp_name: ablation_no_attention_quic40_s_seed3407
    data_csv: data/processed/datazoo_quic40_s_seq30.csv
    seed: 3407
  - exp_name: ablation_no_attention_tls60_s_seed42
    data_csv: data/processed/datazoo_tls60_s_seq30.csv
    seed: 42
  - exp_name: ablation_no_attention_tls60_s_seed2025
    data_csv: data/processed/datazoo_tls60_s_seq30.csv
    seed: 2025
  - exp_name: ablation_no_attention_tls60_s_seed3407
    data_csv: data/processed/datazoo_tls60_s_seq30.csv
    seed: 3407
  - exp_name: ablation_no_attention_quic60_s_seed42
