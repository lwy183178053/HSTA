base:
  output_dir: results/hsta_cm_ablation_s
  seed: 599
  epochs: 100
  patience: 15
  reset_optimizer_on_extend: false
  reset_patience_on_extend: true
  batch_size: 256
  lr: 0.0005
  weight_decay: 0.0001
  lr_scheduler: reduce_on_plateau
  lr_scheduler_metric: val_known_macro_f1
  lr_scheduler_mode: max
  lr_factor: 0.5
  lr_patience: 2
  min_lr: 0.000001
  early_stop_metric: val_known_macro_f1
  early_stop_mode: max
  early_stop_min_delta: 0.0005
  seq_len: 30
  amp: true
  num_workers: 0
  model: hsta-cm
  model_cfg:
    dim: 256
    depth: 2
    heads: 4
    mlp_ratio: 4
    dropout: 0.15
    d_state: 16
    d_conv: 4
    expand: 2
    pooling: mean
    max_len: 30
    conv_kernel_size: 3
    attention_backend: flash
    use_position: true
    use_conv: true
    use_mamba: true
    use_attention: true
  train_unknown: true
  calibrate_reject_threshold: true
  reject_threshold_quantile: 0.95

experiments:
  - exp_name: hsta_cm_no_conv_open_tls40_s_seed599
    data_csv: data/processed/datazoo_tls40_s_protocol_small.csv
    seed: 599
    train_unknown: true
    model_cfg: {use_conv: false}
  - exp_name: hsta_cm_no_mamba_open_tls40_s_seed599
    data_csv: data/processed/datazoo_tls40_s_protocol_small.csv
    seed: 599
    train_unknown: true
    model_cfg: {use_mamba: false}
  - exp_name: hsta_cm_no_attention_open_tls40_s_seed599
    data_csv: data/processed/datazoo_tls40_s_protocol_small.csv
    seed: 599
    train_unknown: true
    model_cfg: {use_attention: false}
  - exp_name: hsta_cm_no_conv_open_quic40_s_seed599
    data_csv: data/processed/datazoo_quic40_s_protocol_small.csv
    seed: 599
    train_unknown: true
    model_cfg: {use_conv: false}
  - exp_name: hsta_cm_no_mamba_open_quic40_s_seed599
    data_csv: data/processed/datazoo_quic40_s_protocol_small.csv
    seed: 599
    train_unknown: true
    model_cfg: {use_mamba: false}
  - exp_name: hsta_cm_no_attention_open_quic40_s_seed599
    data_csv: data/processed/datazoo_quic40_s_protocol_small.csv
    seed: 599
    train_unknown: true
    model_cfg: {use_attention: false}
