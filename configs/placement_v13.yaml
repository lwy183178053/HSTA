# =============================================================================
# HSTA v13 -- Study: attention PLACEMENT, extended to the common 6-seed set
# =============================================================================
#
# WHY THIS FILE EXISTS
#   The placement ablation (Front / Middle / HSTA) is the ONLY control in the
#   paper whose variants are EXACTLY parameter-matched:
#       HSTA              602,408
#       Front Attention   602,408
#       Middle Attention  604,988 (60 classes) / 602,408 (40 classes)
#   That makes it the cleanest evidence the paper has, and it is already
#   measured on 4 tasks x 3 seeds.
#
#   The new ratio study runs 6 seeds. Mixing a 3-seed placement result with a
#   6-seed ratio result would break paired testing, so this file ADDS the three
#   missing seeds (1337, 7, 2024) and reuses the three that already exist.
#
# WHAT IT COSTS
#   2 placement variants x 6 seeds = 12 runs on QUIC-60 (Tier A below).
#   The HSTA reference arm is the published main result; it is re-listed here so
#   the whole table comes from one config, but its existing runs are reused.
#   Tier B adds the two placement variants on TLS-60 for +6 runs.
#
#   Nothing on QUIC-40 / TLS-40: the class-count study is out of scope for this
#   revision (40-class is a nested subset of 60-class, see ratio_scale_v13.yaml).
#
# >>> RESUME / REUSE -- READ THIS <<<
#   Front and Middle already exist for QUIC-60 on 3 seeds. To ADD the 3 new
#   seeds instead of re-running everything, point the output directory at the
#   existing results folder:
#
#       python run_experiments.py --config configs/placement_v13.yaml \
#         --resume --output-dir results/hsta_flash_ablation
#
#   --resume skips any experiment whose summary.csv and best.pt already exist,
#   so only seeds 1337, 7 and 2024 will actually train. Running the wrapper
#   `bash scripts/run_evidence_pack.sh parallel_placement 3` does exactly this.
#
# WHY THIS STUDY SHOULD STAY IN THE PAPER
#   The ratio study FIXES the placement, so its conclusion ("2:1 is best")
#   presupposes that placement matters at all. The placement ablation supplies
#   that premise, and it does so with equal parameter counts -- which the ratio
#   study cannot do, because parameters rise monotonically with Mamba depth:
#       1:1 486k  <  2:1 602k  <  3:1 719k  <  4:1 836k
#   Keep it as the secondary ablation, with the ratio study as the headline.
# =============================================================================

base:
  output_dir: results/placement_v13
  seed: 42
  epochs: 100
  patience: 20
  batch_size: 512
  lr: 0.0005
  weight_decay: 0.0001
  lr_scheduler: reduce_on_plateau
  lr_scheduler_metric: val_macro_f1
  lr_factor: 0.5
  lr_patience: 3
  min_lr: 0.000001
  early_stop_metric: val_macro_f1
  early_stop_min_delta: 0.0005
  seq_len: 30
  amp: true
  num_workers: 0
  model: hsta
  model_cfg:
    dim: 128
    hidden: 128
    heads: 4
    mlp_ratio: 4
    dropout: 0.15
    d_state: 16
    d_conv: 4
    expand: 2
    pooling: mean
    max_len: 256
    attention_backend: flash

experiments:
  # ===========================================================================
  # TIER A (12 new runs) -- placement variants on QUIC-60, 6 seeds.
  # ===========================================================================
  - exp_name: hsta_flash_attention_front_quic60_s_seed42
    data_csv: data/processed/datazoo_quic60_s_seq30.csv
    seed: 42
    model_cfg:
      layout: [attention, mamba, mamba, mlp, mlp]
  - exp_name: hsta_flash_attention_front_quic60_s_seed2025
    data_csv: data/processed/datazoo_quic60_s_seq30.csv
    seed: 2025
    model_cfg:
      layout: [attention, mamba, mamba, mlp, mlp]
  - exp_name: hsta_flash_attention_front_quic60_s_seed3407
    data_csv: data/processed/datazoo_quic60_s_seq30.csv
    seed: 3407
    model_cfg:
      layout: [attention, mamba, mamba, mlp, mlp]
  - exp_name: hsta_flash_attention_front_quic60_s_seed1337
    data_csv: data/processed/datazoo_quic60_s_seq30.csv
    seed: 1337
    model_cfg:
      layout: [attention, mamba, mamba, mlp, mlp]
  - exp_name: hsta_flash_attention_front_quic60_s_seed7
