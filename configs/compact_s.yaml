# 60 类正式开放集实验；三个独立训练种子，固定同一份数据。
seeds: [599, 5009, 813]
base:
  output_dir: results/formal60
  seed: 599
  epochs: 100
  patience: 15
  batch_size: 4096
  eval_batch_size: 512
  oom_microbatch_fallbacks: [2048, 1024, 512]
  lr: 0.0005
  weight_decay: 0.0001
  lr_scheduler: reduce_on_plateau
  lr_scheduler_metric: val_known_macro_f1
  lr_scheduler_mode: max
  lr_factor: 0.5
  lr_patience: 2
  min_lr: 0.000001
  early_stop_metric: val_known_macro_f1
  early_stop_mode: max
  early_stop_min_delta: 0.0005
  seq_len: 30
  amp: true
  num_workers: 0
  calibrate_reject_threshold: true
  reject_threshold_quantile: 0.95
  model_cfg:
    dim: 256
    depth: 2
    heads: 4
    mlp_ratio: 4
    dropout: 0.15
    d_state: 16
    d_conv: 4
    expand: 2
    attention_backend: flash
experiments:
  - exp_name: hsta_cm_open_tls60
    model: hsta-cm
    data_csv: data/processed/datazoo_tls60_s_protocol.csv
    train_unknown: true
  - exp_name: hsta_cm_closed_tls60
    model: hsta-cm
    data_csv: data/processed/datazoo_tls60_s_protocol.csv
    train_unknown: false
  - exp_name: tcnet_tls60
    model: 30pkttcnet-adapted
    data_csv: data/processed/datazoo_tls60_s_protocol.csv
    train_unknown: false
    model_cfg: {depth: 5}
  - exp_name: netmamba_tls60
    model: netmamba-adapted
    data_csv: data/processed/datazoo_tls60_s_protocol.csv
    train_unknown: false
    model_cfg: {depth: 5, max_len: 30}
  - exp_name: srvit_tls60
    model: srvit
    data_csv: data/processed/datazoo_tls60_s_protocol.csv
    train_unknown: false
    model_cfg: {depth: 4}
  - exp_name: trafficaudio_tls60
    model: trafficaudio
    data_csv: data/processed/datazoo_tls60_s_protocol.csv
    train_unknown: false
    model_cfg: {n_fft: 32, win_length: 32, hop_length: 8, n_mels: 16, n_mfcc: 8}
  - exp_name: bpfgnn_tls60
    model: bpf-gnn
    data_csv: data/processed/datazoo_tls60_s_protocol.csv
    train_unknown: false
  - exp_name: hsta_cm_open_quic60
    model: hsta-cm
    data_csv: data/processed/datazoo_quic60_s_protocol.csv
    train_unknown: true
  - exp_name: hsta_cm_closed_quic60
    model: hsta-cm
    data_csv: data/processed/datazoo_quic60_s_protocol.csv
    train_unknown: false
  - exp_name: tcnet_quic60
    model: 30pkttcnet-adapted
    data_csv: data/processed/datazoo_quic60_s_protocol.csv
    train_unknown: false
    model_cfg: {depth: 5}
  - exp_name: netmamba_quic60
    model: netmamba-adapted
    data_csv: data/processed/datazoo_quic60_s_protocol.csv
    train_unknown: false
    model_cfg: {depth: 5, max_len: 30}
  - exp_name: srvit_quic60
    model: srvit
    data_csv: data/processed/datazoo_quic60_s_protocol.csv
    train_unknown: false
    model_cfg: {depth: 4}
  - exp_name: trafficaudio_quic60
    model: trafficaudio
    data_csv: data/processed/datazoo_quic60_s_protocol.csv
    train_unknown: false
    model_cfg: {n_fft: 32, win_length: 32, hop_length: 8, n_mels: 16, n_mfcc: 8}
  - exp_name: bpfgnn_quic60
    model: bpf-gnn
    data_csv: data/processed/datazoo_quic60_s_protocol.csv
    train_unknown: false
