base:
  data_csv: data/processed/datazoo_quic40_s_seq30.csv
  output_dir: results/quic40_s
  seed: 42
  epochs: 100
  patience: 20
  batch_size: 512
  lr: 0.0005
  weight_decay: 0.0001
  lr_scheduler: reduce_on_plateau
  lr_scheduler_metric: val_macro_f1
  lr_factor: 0.5
  lr_patience: 3
  min_lr: 0.000001
  early_stop_metric: val_macro_f1
  early_stop_min_delta: 0.0005
  seq_len: 30
  amp: true
  num_workers: 0
  model_cfg:
    dim: 128
    hidden: 128
    depth: 5
    heads: 4
    mlp_ratio: 4
    dropout: 0.15
    d_state: 16
    d_conv: 4
    expand: 2
    pooling: mean
    max_len: 256

experiments:
  - exp_name: mlp_5layer_quic40_s
    model: mlp
  - exp_name: cnn_5layer_quic40_s
    model: cnn
  - exp_name: lstm_5layer_quic40_s
    model: lstm
    model_cfg:
      pooling: last
  - exp_name: gru_5layer_quic40_s
    model: gru
    model_cfg:
      pooling: last
  - exp_name: transformer_5layer_quic40_s_seed42
    model: transformer
  - exp_name: transformer_5layer_quic40_s_seed2025
    model: transformer
    seed: 2025
  - exp_name: transformer_5layer_quic40_s_seed3407
    model: transformer
    seed: 3407
  - exp_name: hybrid_mm_mlp_a_mlp_quic40_s_seed42
    model: hybrid
    model_cfg:
      layout: [mamba, mamba, mlp, attention, mlp]
  - exp_name: hybrid_mm_mlp_a_mlp_2block_quic40_s_seed42
    model: hybrid
    model_cfg:
      layout: [mamba, mamba, mlp, attention, mlp]
      block_repeats: 2
  - exp_name: hybrid_mm_mlp_a_mlp_4block_quic40_s_seed42
    model: hybrid
    model_cfg:
      layout: [mamba, mamba, mlp, attention, mlp]
      block_repeats: 4
  - exp_name: hybrid_mm_mlp_a_mlp_quic40_s_seed2025
    model: hybrid
    seed: 2025
    model_cfg:
      layout: [mamba, mamba, mlp, attention, mlp]
  - exp_name: hybrid_mm_mlp_a_mlp_quic40_s_seed3407
    model: hybrid
    seed: 3407
    model_cfg:
      layout: [mamba, mamba, mlp, attention, mlp]
