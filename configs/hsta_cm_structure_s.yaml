base:
  # Fast structure screen on the current 40-class small protocol.
  # The selected winner is copied into compact_s.yaml for the formal run.
  output_dir: results/hsta_cm_structure_s
  seed: 599
  epochs: 30
  patience: 5
  reset_optimizer_on_extend: false
  reset_patience_on_extend: true
  batch_size: 256
  lr: 0.0005
  weight_decay: 0.0001
  lr_scheduler: reduce_on_plateau
  lr_scheduler_metric: val_known_macro_f1
  lr_scheduler_mode: max
  lr_factor: 0.5
  lr_patience: 2
  min_lr: 0.000001
  early_stop_metric: val_known_macro_f1
  early_stop_mode: max
  early_stop_min_delta: 0.0005
  seq_len: 30
  amp: true
  num_workers: 0
  calibrate_reject_threshold: true
  reject_threshold_quantile: 0.95
  model_cfg:
    dim: 256
    depth: 2
    heads: 4
    mlp_ratio: 4
    dropout: 0.15
    d_state: 16
    d_conv: 4
    expand: 2
    pooling: mean
    max_len: 30
    conv_kernel_size: 3
    attention_backend: flash
    use_position: true
    use_packet_position: false
    use_frequency_position: false
    use_branch_type: false
    use_conv: true
    use_mamba: true
    use_attention: true
    use_dft: false
    fusion_mode: aligned

experiments:
  # Baseline HSTA-CM: original two branches, three k=3 residual blocks,
  # and the original post-fusion packet position embedding.
  - exp_name: hsta_cm_base_tls40_s_seed599
    model: hsta-cm
    data_csv: data/processed/datazoo_tls40_s_protocol_small.csv
    seed: 599
    train_unknown: true
  - exp_name: hsta_cm_base_quic40_s_seed599
    model: hsta-cm
    data_csv: data/processed/datazoo_quic40_s_protocol_small.csv
    seed: 599
    train_unknown: true

  # Two branches with progressive raw-packet Conv1d kernels and packet plus
  # branch-type encodings.
  - exp_name: hsta_cm_dual_multiscale_tls40_s_seed599
    model: hsta-cm
    data_csv: data/processed/datazoo_tls40_s_protocol_small.csv
    seed: 599
    train_unknown: true
    model_cfg:
      conv_kernel_schedule: [1, 3, 5]
      use_packet_position: true
      use_branch_type: true
  - exp_name: hsta_cm_dual_multiscale_quic40_s_seed599
    model: hsta-cm
    data_csv: data/processed/datazoo_quic40_s_protocol_small.csv
    seed: 599
    train_unknown: true
    model_cfg:
      conv_kernel_schedule: [1, 3, 5]
      use_packet_position: true
      use_branch_type: true

  # Mamba + raw Conv1d + DFT Conv1d. DFT retains 16 rFFT tokens (real and
  # imaginary channels), with frequency positions and three branch encodings.
  - exp_name: hsta_cm_dual_dft_tls40_s_seed599
    model: hsta-cm
    data_csv: data/processed/datazoo_tls40_s_protocol_small.csv
    seed: 599
    train_unknown: true
    model_cfg:
      max_len: 76
      pooling: branch_mean
      use_packet_position: true
      use_frequency_position: true
      use_branch_type: true
      use_dft: true
      fusion_mode: tokens
      dft_conv_kernel_schedule: [3, 3, 3]
  - exp_name: hsta_cm_dual_dft_quic40_s_seed599
    model: hsta-cm
    data_csv: data/processed/datazoo_quic40_s_protocol_small.csv
    seed: 599
    train_unknown: true
    model_cfg:
      max_len: 76
      pooling: branch_mean
      use_packet_position: true
      use_frequency_position: true
      use_branch_type: true
      use_dft: true
      fusion_mode: tokens
      dft_conv_kernel_schedule: [3, 3, 3]

  # Complete three-branch candidate. Both convolution branches use the
  # progressive 1/3/5 residual extraction block and all three encodings.
  - exp_name: hsta_cm_tri_multiscale_dft_tls40_s_seed599
    model: hsta-cm
    data_csv: data/processed/datazoo_tls40_s_protocol_small.csv
    seed: 599
    train_unknown: true
    model_cfg:
      max_len: 76
      pooling: branch_mean
      use_packet_position: true
      use_frequency_position: true
      use_branch_type: true
      use_dft: true
      fusion_mode: tokens
      conv_kernel_schedule: [1, 3, 5]
      dft_conv_kernel_schedule: [1, 3, 5]
  - exp_name: hsta_cm_tri_multiscale_dft_quic40_s_seed599
    model: hsta-cm
    data_csv: data/processed/datazoo_quic40_s_protocol_small.csv
    seed: 599
    train_unknown: true
    model_cfg:
      max_len: 76
      pooling: branch_mean
      use_packet_position: true
      use_frequency_position: true
      use_branch_type: true
      use_dft: true
      fusion_mode: tokens
      conv_kernel_schedule: [1, 3, 5]
      dft_conv_kernel_schedule: [1, 3, 5]
