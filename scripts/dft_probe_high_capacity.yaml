base:
  output_dir: results/dft_probe_tls_s_high_capacity
  seed: 599
  epochs: 100
  patience: 15
  reset_optimizer_on_extend: false
  reset_patience_on_extend: true
  batch_size: 256
  lr: 0.0005
  weight_decay: 0.0001
  lr_scheduler: reduce_on_plateau
  lr_scheduler_metric: val_macro_f1
  lr_factor: 0.5
  lr_patience: 2
  min_lr: 0.000001
  early_stop_metric: val_raw_open_set_macro_f1
  early_stop_min_delta: 0.0005
  seq_len: 30
  amp: true
  num_workers: 0
  train_unknown: true
  calibrate_reject_threshold: true
  reject_threshold_quantile: 0.95
  model_cfg:
    dim: 128
    depth: 2
    heads: 4
    mlp_ratio: 4
    dropout: 0.15
    d_state: 16
    d_conv: 4
    expand: 2
    pooling: mean
    max_len: 30
    attention_backend: flash

experiments:
  - {exp_name: dft_ri_tokens_last_tls22_s_seed599, model: hsta-cm-dft, data_csv: data/processed/datazoo_tls100_s_protocol_small_sampled.csv, seed: 599, model_cfg: {frequency_representation: real_imag, fusion_mode: tokens, pooling: last}}
  - {exp_name: dft_mag_tokens_last_tls22_s_seed599, model: hsta-cm-dft, data_csv: data/processed/datazoo_tls100_s_protocol_small_sampled.csv, seed: 599, model_cfg: {frequency_representation: magnitude, fusion_mode: tokens, pooling: last}}
  - {exp_name: dft_dual_ri_tokens_mean_tls22_s_seed599, model: hsta-cm-dft, data_csv: data/processed/datazoo_tls100_s_protocol_small_sampled.csv, seed: 599, model_cfg: {frequency_representation: real_imag, fusion_mode: tokens, use_raw_conv: true, pooling: mean}}
  - {exp_name: dft_dual_mag_tokens_mean_tls22_s_seed599, model: hsta-cm-dft, data_csv: data/processed/datazoo_tls100_s_protocol_small_sampled.csv, seed: 599, model_cfg: {frequency_representation: magnitude, fusion_mode: tokens, use_raw_conv: true, pooling: mean}}
  - {exp_name: dft_dual_ri_tokens_temporal_mean_tls22_s_seed599, model: hsta-cm-dft, data_csv: data/processed/datazoo_tls100_s_protocol_small_sampled.csv, seed: 599, model_cfg: {frequency_representation: real_imag, fusion_mode: tokens, use_raw_conv: true, pooling: temporal_mean}}
  - {exp_name: dft_dual_mag_tokens_temporal_mean_tls22_s_seed599, model: hsta-cm-dft, data_csv: data/processed/datazoo_tls100_s_protocol_small_sampled.csv, seed: 599, model_cfg: {frequency_representation: magnitude, fusion_mode: tokens, use_raw_conv: true, pooling: temporal_mean}}
  - {exp_name: dft_dual_ri_tokens_cls_tls22_s_seed599, model: hsta-cm-dft, data_csv: data/processed/datazoo_tls100_s_protocol_small_sampled.csv, seed: 599, model_cfg: {frequency_representation: real_imag, fusion_mode: tokens, use_raw_conv: true, pooling: cls}}
  - {exp_name: dft_dual_mag_tokens_cls_tls22_s_seed599, model: hsta-cm-dft, data_csv: data/processed/datazoo_tls100_s_protocol_small_sampled.csv, seed: 599, model_cfg: {frequency_representation: magnitude, fusion_mode: tokens, use_raw_conv: true, pooling: cls}}
  - {exp_name: dft_mag_tokens_temporal_scale_tls22_s_seed599, model: hsta-cm-dft, data_csv: data/processed/datazoo_tls100_s_protocol_small_sampled.csv, seed: 599, model_cfg: {frequency_representation: magnitude, fusion_mode: tokens, pooling: temporal_mean, frequency_token_scale: 0.1}}
  - {exp_name: dft_ri_tokens_temporal_scale_tls22_s_seed599, model: hsta-cm-dft, data_csv: data/processed/datazoo_tls100_s_protocol_small_sampled.csv, seed: 599, model_cfg: {frequency_representation: real_imag, fusion_mode: tokens, pooling: temporal_mean, frequency_token_scale: 0.1}}
  - {exp_name: dft_dual_mag_tokens_mean_scale_tls22_s_seed599, model: hsta-cm-dft, data_csv: data/processed/datazoo_tls100_s_protocol_small_sampled.csv, seed: 599, model_cfg: {frequency_representation: magnitude, fusion_mode: tokens, use_raw_conv: true, pooling: mean, frequency_token_scale: 0.1}}
  - {exp_name: dft_dual_ri_tokens_mean_scale_tls22_s_seed599, model: hsta-cm-dft, data_csv: data/processed/datazoo_tls100_s_protocol_small_sampled.csv, seed: 599, model_cfg: {frequency_representation: real_imag, fusion_mode: tokens, use_raw_conv: true, pooling: mean, frequency_token_scale: 0.1}}
